<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnQueue — Phone (hi-fi interactive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Fraunces:opsz,wght@9..144,500;600;700&display=swap">
<style>
  :root{
    --bg:#efe9dd; --panel:#ffffff; --ink:#191c24; --mut:#565c69; --faint:#6c675b;
    --line:#e9e5db; --line2:#f2efe8; --cell:#fdfcf9; --blockLine:#e3ddd0;
    --dark:#20242e; --sel:#eef1f7; --field:#f3f5f9; --place:#646a79;
    --emb:#6d5cb3; --emb-t:#efedf9; --emb-d:#4c3f88;
    --scr:#3d6fb4; --scr-t:#e9f1fb; --scr-d:#2b5490;
    --dtf:#c07a2e; --dtf-t:#fbf1e2; --dtf-d:#8c5716;
    --grn:#1f9d6b; --grn-t:#e6f5ee; --grn-d:#116b48;
    --yel:#c98a1e; --yel-t:#faf0d8; --yel-d:#875c11;
    --red:#d5433f; --red-t:#fbe7e6; --red-d:#a02b28;
    --logobg:#e7ddc9; --qpurple:#7d6fa6;
    --sh-sm:0 1px 2px rgba(20,23,33,.07);
    --sh:0 6px 18px -8px rgba(20,23,33,.20);
    --sh-lg:0 30px 64px -26px rgba(18,21,32,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);
    background:radial-gradient(1000px 520px at 72% -8%,#f6f1e7 0,#efe9dd 58%,#e7dfce 100%);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4;
    display:flex;flex-direction:column;align-items:center;padding:24px 12px 60px}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#726c5d;margin-bottom:14px;text-align:center}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .phone{width:390px;height:812px;background:var(--panel);border:1px solid #e6ded0;border-radius:40px;overflow:hidden;
    box-shadow:var(--sh-lg);position:relative;display:flex;flex-direction:column}
  .stat{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:12px;font-weight:600;color:var(--ink)}
  .stat .r{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mut)}
  .home{height:22px;flex:none;display:flex;align-items:center;justify-content:center}
  .home i{width:120px;height:5px;border-radius:3px;background:#dcd6ca}
  .body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #main{flex:1;display:flex;flex-direction:column;min-height:0}

  /* header */
  .appbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;border-bottom:1px solid var(--line);flex:none;background:linear-gradient(#ffffff,#fcfdfe)}
  .logo{display:flex;align-items:baseline;gap:9px}
  .logo .mark{width:26px;height:26px;border:none;border-radius:7px;background:var(--logobg);overflow:hidden;display:flex;align-self:center;
    box-shadow:var(--sh-sm),inset 0 0 0 1px rgba(120,90,40,.06)}
  .logo .mark svg{width:100%;height:100%;display:block}
  .logo .wm{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--ink);display:inline-flex;align-items:baseline}
  .logo .qsvg{height:.82em;width:auto;align-self:baseline;transform:translateY(.12em);margin:0 -.01em}
  .grow{flex:1}
  .ib{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--mut);font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm)}
  .ib.on{background:var(--sel);color:var(--ink);border-color:#c9cfdb}
  .addp{height:38px;padding:0 15px;border-radius:10px;background:linear-gradient(#2c313d,#191d26);color:#fff;border:none;font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px;
    box-shadow:0 4px 12px -3px rgba(20,23,33,.5),inset 0 1px 0 rgba(255,255,255,.12)}

  .segtabs{display:flex;margin:14px 16px 0;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex:none}
  .segtabs .t{flex:1;text-align:center;padding:8px;font-size:13px;color:var(--mut);background:transparent;border:none;border-radius:8px;font-weight:500}
  .segtabs .t.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--sh-sm)}

  .weekstrip{display:flex;gap:6px;padding:14px 16px 0;flex:none}
  .wd{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 2px;background:#fff;text-align:center;line-height:1.1;box-shadow:var(--sh-sm)}
  .wd b{display:block;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.03em;color:var(--mut)}
  .wd small{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-top:3px}
  .wd.on{background:linear-gradient(#2c313d,#191d26);border-color:#20242e}
  .wd.on b,.wd.on small{color:#fff}

  .chips{display:flex;gap:8px;padding:14px 16px 0;overflow-x:auto;flex:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:100px;padding:8px 14px;font-size:12.5px;color:var(--mut);background:#fff;white-space:nowrap;box-shadow:var(--sh-sm)}
  .chip.on{background:var(--sel);color:var(--ink);font-weight:600;border-color:#c9cfdb}
  .chip.on:has(.m-emb){background:var(--emb-t);border-color:#d8d0ee}
  .chip.on:has(.m-scr){background:var(--scr-t);border-color:#cadff5}
  .chip.on:has(.m-dtf){background:var(--dtf-t);border-color:#eed6b6}
  .mdot{width:10px;height:10px;border-radius:50%;flex:none}
  .m-emb{background:var(--emb)}.m-scr{background:var(--scr)}.m-dtf{background:var(--dtf)}

  .machrow{display:flex;align-items:center;gap:8px;padding:14px 16px 4px;flex:none}
  .mch{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:100px;padding:7px 15px;font-size:13px;color:var(--mut);background:#fff;font-weight:600;box-shadow:var(--sh-sm)}
  .mch.on{background:var(--sel);color:var(--ink);border-color:#c9cfdb}
  .mch .ld{width:9px;height:9px;border-radius:50%;border:1.5px solid #b5b5b2}
  .mm-emb .mch.on{background:var(--emb-t);border-color:#d8d0ee}.mm-emb .mch.on .ld{background:var(--emb);border-color:var(--emb)}
  .mm-scr .mch.on{background:var(--scr-t);border-color:#cadff5}.mm-scr .mch.on .ld{background:var(--scr);border-color:var(--scr)}
  .mm-dtf .mch.on{background:var(--dtf-t);border-color:#eed6b6}.mm-dtf .mch.on .ld{background:var(--dtf);border-color:var(--dtf)}

  .movebar2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 16px 0;padding:8px 8px 8px 14px;border:1px solid #ecdcb4;background:linear-gradient(#fbf4e2,#f9efd6);border-radius:12px;flex:none;box-shadow:var(--sh-sm)}
  .movebar2[hidden]{display:none}
  .movebar2 .msg{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0;color:#7a5f1c;font-weight:600}
  .movebar2 .msg b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .movebar2 .cbdot{width:8px;height:8px;border-radius:50%;background:var(--yel);flex:none;box-shadow:0 0 0 4px rgba(201,138,30,.16)}
  .movebar2 .acts{display:flex;gap:7px;flex:none}
  .movebar2 .mb{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid #e3d6b3;background:#fff;color:var(--ink)}
  .movebar2 .mb.save{background:linear-gradient(#2c313d,#191d26);color:#fff;border-color:#20242e}

  .ib.on{background:var(--sel);color:var(--ink);border-color:#c9cfdb}
  .searchbar{display:flex;align-items:center;gap:8px;margin:14px 16px 0;padding:0 12px;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--field);flex:none;box-shadow:var(--sh-sm)}
  .searchbar .si{color:var(--faint);font-size:15px}
  .searchbar input{flex:1;border:none;background:transparent;font-size:14px;font-family:inherit;color:var(--ink);outline:none}
  .searchbar input::placeholder{color:var(--place)}
  .searchbar .sx{border:none;background:none;color:var(--mut);font-size:18px;font-family:Arial}

  /* status badge */
  .st{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:100px;border:1px solid transparent;white-space:nowrap}
  .st.red{background:var(--red-t);color:var(--red-d);border-color:#f0c3c1}
  .st.yel{background:var(--yel-t);color:var(--yel-d);border-color:#ecd7a3}
  .st.grn{background:var(--grn-t);color:var(--grn-d);border-color:#bfe3d1}

  .calwrap,.ovbody,.chips,.nlist,.daypick,.weekstrip{scrollbar-width:none;-ms-overflow-style:none}
  .calwrap::-webkit-scrollbar,.ovbody::-webkit-scrollbar,.chips::-webkit-scrollbar,.nlist::-webkit-scrollbar,.daypick::-webkit-scrollbar,.weekstrip::-webkit-scrollbar{display:none;width:0;height:0}
  .csd,.sdot,.dchk{line-height:0}
  .csd svg,.sdot svg,.dchk svg{display:block;margin:auto}

  /* calendar */
  .calwrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .cal{display:grid;grid-template-columns:30px 1fr 1fr;column-gap:8px;padding:6px 16px 40px}
  .lanehd{grid-row:1;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;color:var(--mut);font-weight:600;text-align:center;padding-bottom:6px}
  .gut{grid-column:1;grid-row:2;display:flex;flex-direction:column}
  .gut .h{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);text-align:left;transform:translateY(-7px);white-space:nowrap}
  .lane{position:relative;border-left:1px solid var(--line2)}
  .lane .hr{border-bottom:1px solid var(--line2)}
  .cblock{position:absolute;left:2px;right:1px;border:1px solid var(--blockLine);border-left:3px solid #c9c9c7;border-radius:9px;background:#fff;padding:5px 8px;box-shadow:var(--sh-sm);overflow:hidden;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cblock.e{background:var(--emb-t);border-color:#e0dbf1;border-left-color:var(--emb)}
  .cblock.s{background:var(--scr-t);border-color:#d3e2f4;border-left-color:var(--scr)}
  .cblock.d{background:var(--dtf-t);border-color:#eeddc4;border-left-color:var(--dtf)}
  .cblock.otb{border-style:solid}
  .cblock.cont{background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 7px,rgba(255,255,255,.2) 7px 14px);color:var(--mut)}
  .cblock .ct{display:flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--mut)}
  .cblock.e .ct{color:var(--emb-d)}.cblock.s .ct{color:var(--scr-d)}.cblock.d .ct{color:var(--dtf-d)}
  .cblock .cc{font-size:12px;font-weight:600;line-height:1.14;margin-top:2px;color:var(--ink);letter-spacing:-.01em}
  .cblock .cm{font-size:9.5px;color:var(--mut);margin-top:1px}
  .cal.single .lanehd{font-size:12px}
  .cal.single .cblock .ct{font-size:10px}
  .cal.single .cblock .cc{font-size:15px}
  .cal.single .cblock .cm{font-size:12px}
  .cblock.done{opacity:.6;filter:grayscale(.85)}
  .csd{width:12px;height:12px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;box-shadow:0 0 0 1.5px var(--panel)}
  .csd svg{width:7px;height:7px;display:block}
  .csd.g{background:var(--grn)}.csd.y{background:var(--yel)}.csd.r{background:var(--red)}.csd.k{background:#9a9388}
  .cblock.sel{outline:2px solid var(--dark);outline-offset:1px;z-index:5;overflow:visible;box-shadow:0 10px 20px -8px rgba(20,23,33,.5)}
  .movearr{position:absolute;left:0;right:0;height:24px;border-radius:9px;background:linear-gradient(#2c313d,#191d26);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;z-index:6;box-shadow:0 4px 10px -3px rgba(20,23,33,.6);border:none}
  .movearr:disabled{opacity:.4}
  .movearr.up{top:-29px}.movearr.dn{bottom:-29px}
  .emptycal{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px}

  /* overlays */
  .ov{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:20;
    transform:translateX(100%);transition:transform .22s ease;overflow:hidden}
  .ov.on{transform:none}
  .ov.sheet{top:auto;transform:translateY(100%);border-radius:22px 22px 0 0;box-shadow:0 -14px 34px -14px rgba(18,21,32,.45)}
  .ov.sheet.on{transform:none}
  .ovhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
  .ovhead .nav{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--mut);font-size:18px;display:flex;align-items:center;justify-content:center}
  .ovhead .ti{flex:1;min-width:0}
  .ovhead h2{font-family:"Fraunces",Georgia,serif;font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovhead .cr{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-top:2px}
  .ovbody{flex:1;overflow-y:auto;padding:14px 16px 18px}
  .ovfoot{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:9px;flex:none;background:var(--panel)}
  .btn{padding:13px;border-radius:11px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);text-align:center;width:100%}
  .btn.primary{background:linear-gradient(#2c313d,#191d26);color:#fff;border-color:#20242e;box-shadow:0 4px 12px -3px rgba(20,23,33,.5)}
  .btn.ghost{color:var(--mut)}
  .btnrow{display:flex;gap:10px}.btnrow .btn{width:auto;flex:1}

  /* detail */
  .methtag{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:100px;padding:5px 11px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:#fff}
  .methtag .md{width:9px;height:9px;border-radius:50%}
  .dh h2{font-family:"Fraunces",Georgia,serif;font-size:22px;margin:12px 0 0;font-weight:600;letter-spacing:-.01em}
  .dsub{font-size:13px;color:var(--mut);margin-top:3px}
  .dbadge{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .lockrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
  .lockrow svg{width:11px;height:13px}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:3px 10px 3px 6px;font-size:11px;font-weight:600}
  .pill .sdot{width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .pill .sdot svg{width:8px;height:8px}
  .p-grn{background:var(--grn-t);color:var(--grn-d)}.p-grn .sdot{background:var(--grn)}
  .p-yel{background:var(--yel-t);color:var(--yel-d)}.p-yel .sdot{background:var(--yel)}
  .p-red{background:var(--red-t);color:var(--red-d)}.p-red .sdot{background:var(--red)}
  .p-done{background:#eef1ee;color:#4a5a50}.p-done .sdot{background:#9a9388}
  .movebar{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--cell)}
  .movebar .mi{flex:1}.movebar .lab{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-family:"IBM Plex Mono",monospace}
  .movebar .slot{font-size:14px;font-weight:600;margin-top:2px}
  .movebar .rb{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600}
  .dsec{padding:14px 0;border-bottom:1px solid var(--line2)}.dsec:last-child{border-bottom:none}
  .dsec h3{font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 9px}
  .drow{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding:4px 0}
  .drow .k{color:var(--mut)}.drow .v{text-align:right}
  .drow.total{font-weight:700;border-top:1px solid var(--line2);margin-top:4px;padding-top:8px}
  .dnote{font-size:13px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:text;line-height:1.5;white-space:pre-wrap}
  .dnote.empty{color:var(--place)}
  textarea.dnote.editing{width:100%;min-height:84px;font-family:inherit;resize:vertical;outline:none;border-color:var(--mut);cursor:text}
  textarea.dnote.editing::placeholder{color:var(--place)}
  .donebadge{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--grn-t);border:1px solid #bfe3d1;color:var(--grn-d);border-radius:11px;padding:12px;font-size:13px;font-weight:600}
  .donebadge svg{width:15px;height:15px}
  .efld{margin-bottom:11px}
  .efld label{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
  .efld input,.efld select,.efld textarea{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:0 12px;font-size:14px;color:var(--ink);font-family:inherit}
  .efld textarea{height:auto;min-height:70px;padding:10px 12px;line-height:1.5}

  /* reschedule sheet */
  .rsec{margin-bottom:16px}
  .rsec h4{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{flex:1;min-width:calc(50% - 4px);border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;text-align:center;font-size:13.5px;font-weight:600;color:var(--ink)}
  .opt.on{background:var(--sel);border-color:#c9cfdb}
  .opt small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:2px}
  .daypick{display:flex;gap:6px;overflow-x:auto}
  .daypick .dp{flex:none;border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#fff;text-align:center;min-width:58px}
  .daypick .dp.on{background:var(--sel);border-color:#c9cfdb}
  .daypick .dp b{font-size:13px}.daypick .dp small{display:block;font-size:10px;color:var(--mut);font-family:"IBM Plex Mono",monospace}

  /* add-a-job form */
  .sec{margin-bottom:20px}
  .sec>h3{font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
  .fld{margin-bottom:11px}.fld:last-child{margin-bottom:0}
  .two{display:flex;gap:10px}.two .fld{flex:1}
  .three{display:flex;gap:8px}.three .fld{flex:1;min-width:0}
  .flabel{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
  .flabel .req{color:var(--red)}
  .in{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);display:flex;align-items:center;padding:0 12px;font-size:14px;color:var(--place)}
  .in.filled{color:var(--ink)}
  input.in,select.in{font-family:inherit;color:var(--ink);-webkit-appearance:none;appearance:none}
  input.in::placeholder{color:var(--place)}
  select.in{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 24 24' fill='none' stroke='%23646a79' stroke-width='3'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
  .in.up{justify-content:space-between}.in.up .chev{color:var(--faint)}
  .tog{display:flex;height:44px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .tog .t{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);background:#fff;border-right:1px solid var(--line);border-top:none;border-bottom:none;border-left:none}
  .tog .t:last-child{border-right:none}
  .tog .t.on{background:var(--sel);color:var(--ink);font-weight:600}
  .tog.disabled{opacity:.4;pointer-events:none}

function dayCaps(H){const caps=[];let work=H;for(let d=0;d<DAYS;d++){const rest=8*(DAYS-d);let c;
  if(work<=rest)c=Math.min(8,work);else c=8+Math.min(OT_MAX,Math.ceil((work-rest)/(DAYS-d)));

    const status=(overflow||slack<0)?'red':(slack<=2?'yel':'grn');

    const primary=segs.reduce((b,s,i)=>s.len>segs[b].len?i:b,0);
    return {...j,segs,finishDate,finishDay,status,primary,overflow,usesOT};});}

/* =============== interactions: schedule =============== */
function wireSched(){
  main.querySelectorAll('.segtabs .t').forEach(t=>t.onclick=()=>{view=t.dataset.view;sel=null;renderMain();});
  main.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{curMethod=c.dataset.m;sel=null;renderMain();});
  main.querySelectorAll('.mch').forEach(m=>m.onclick=()=>{
    const ln=+m.dataset.lane, other=ln===0?1:0;
    if(laneActive[ln]&&!laneActive[other])return;   // keep at least one machine on
    laneActive[ln]=!laneActive[ln];
    if(sel&&!laneActive[data[curMethod][sel.di].lane||0])sel=null;
    renderMain();
  });
  main.querySelectorAll('.wd').forEach(w=>w.onclick=()=>{curDay=+w.dataset.day;sel=null;renderMain();});
  const bs=$('btnSearch'); if(bs)bs.onclick=()=>{searchOpen=!searchOpen;if(!searchOpen)searchText='';renderMain();};
  const sc=$('searchClose'); if(sc)sc.onclick=()=>{searchOpen=false;searchText='';renderMain();};
  const si=$('searchInput'); if(si)si.oninput=()=>{searchText=si.value;renderMain();};
  const ba=$('btnAdd'); if(ba)ba.onclick=()=>openAdd();
  const cs=$('cbSave'),cr=$('cbRevert');
  if(cs)cs.onclick=()=>{dirty=false;baseline=null;sel=null;renderMain();};
  if(cr)cr.onclick=()=>{if(baseline){const s=JSON.parse(baseline);for(const k in s)data[k]=s[k];}dirty=false;baseline=null;sel=null;renderMain();};

  main.querySelectorAll('.cblock').forEach(bl=>{
    const di=+bl.dataset.di, isPrimary=bl.dataset.primary==='1';
    // move arrows
    bl.querySelectorAll('.movearr').forEach(a=>a.onclick=e=>{e.stopPropagation();moveJob(di,+a.dataset.move);});
    let timer=null, longp=false;
    const start=e=>{ if(bl.classList.contains('done'))return; longp=false;
      timer=setTimeout(()=>{longp=true;enterMove(di);},420); };
    const cancel=()=>{ if(timer)clearTimeout(timer); };
    bl.addEventListener('pointerdown',start);
    bl.addEventListener('pointerup',e=>{ cancel();
      if(e.target.closest('.movearr'))return;
      if(longp)return;                       // long-press already handled
      if(suppressTap){suppressTap=false;return;}  // release right after entering move mode
      openDetail(di);
    });
    bl.addEventListener('pointerleave',cancel);
    bl.addEventListener('pointercancel',cancel);
  });
}
function enterMove(di){ sel={di}; markDirty(); suppressTap=true; renderMain(); setTimeout(()=>suppressTap=false,500); }
function moveJob(di,dir){
  const arr=data[curMethod]; const lane=arr[di].lane||0;
  const order=laneOrder(curMethod,lane); const pos=order.indexOf(di);
  const swap = dir<0?order[pos-1]:order[pos+1];
  if(swap==null) return;
  markDirty();
  [arr[di],arr[swap]]=[arr[swap],arr[di]];
  sel={di:swap};                             // selection follows the job to its new index
  renderMain();
}

function applyResched(){
  const arr=data[curMethod]; const b=arr[detailDi];

    // move within array so it is first/last among its lane
    const item=arr.splice(detailDi,1)[0];

      let insert=arr.findIndex(x=>(x.lane||0)===rsLane);
      if(insert<0)insert=arr.length; arr.splice(insert,0,item);

      let insert=-1; arr.forEach((x,i)=>{if((x.lane||0)===rsLane)insert=i;});

function qtyOf(count){return parseInt(String(count).replace(/\D+/g,''),10)||0;}
function nounOf(count){return String(count).replace(/^[\d,\s]+/,'').trim()||'pieces';}
const UP='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
function locBlock(n,first,rerun){
  const dis=rerun?' disabled':'';
  return '<div class="loc"><div class="lh"><span>LOCATION '+n+'</span><button class="del">Remove</button></div>'+
    '<div class="fld"><label class="flabel">Design</label><div class="tog aj-design"><button class="t'+(rerun?'':' on')+'" data-v="new">New design</button><button class="t'+(rerun?' on':'')+'" data-v="rerun">Rerun File</button></div></div>'+
    '<div class="fld"><label class="flabel">Production file</label><div class="in up"><span>Upload / attach file</span><span class="chev">'+UP+'</span></div></div>'+
    '<div class="two"><div class="fld"><label class="flabel">Digitizing?</label><div class="tog aj-dig'+dis+'"><button class="t on">Yes</button><button class="t">No</button></div></div>'+
    '<div class="fld"><label class="flabel">Sample?</label><div class="tog aj-sample'+dis+'"><button class="t on">Yes</button><button class="t">No</button></div></div></div>'+
    '<div class="fld"><label class="flabel">Placement</label><input class="in filled" value="'+(first?'Left chest':'')+'" placeholder="e.g. Full back"></div>'+
    '<div class="three"><div class="fld"><label class="flabel">Stitches</label><div class="in filled">'+(first?'9,000':'—')+'</div></div>'+
    '<div class="fld"><label class="flabel">Trims</label><div class="in filled">'+(first?'12':'—')+'</div></div>'+
    '<div class="fld"><label class="flabel">Threads</label><div class="in filled">'+(first?'3':'—')+'</div></div></div>'+
    '<div class="hint">Auto-fills from the design file. Rough until digitized.</div></div>';
}
function openAdd(editDi){
  AJ.add=0;
  ajEditDi = (editDi!=null && editDi!==undefined) ? editDi : null;
  const isEdit = ajEditDi!=null;
  const b = isEdit ? data[curMethod][ajEditDi] : null;
  const V={
    title: isEdit?'Edit Job':'Add a job',
    crumb: isEdit?esc(b.cust):'New job · unsaved',
    cust:  isEdit?esc(b.cust):'',
    po:    isEdit?po(ajEditDi):'1043',
    due:   isEdit?esc(b.due):'',
    hard:  isEdit?b.hard:true,
    rerun: isEdit?!!b.rerun:false,
    qty:   isEdit?qtyOf(b.count):48,
  };
  const methSeg=[['emb','Embroidery'],['scr','Screen print'],['dtf','DTF']]
    .map(([m,l])=>'<button class="o'+((isEdit?curMethod:'emb')===m?' on':'')+'">'+l+'</button>').join('');
  const ov=$('ovAdd');
  ov.innerHTML='<div class="ovhead"><button class="nav" id="aBack" aria-label="Back"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>'+
      '<div class="ti"><h2>'+V.title+'</h2><div class="cr">'+V.crumb+'</div></div>'+
      '<button class="nav" id="aClose" aria-label="Close"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></div>'+
    '<div class="ovbody">'+
      '<div class="sec"><h3>Order</h3>'+
        '<div class="fld"><label class="flabel">Customer <span class="req">*</span></label><input class="in'+(V.cust?' filled':'')+'" id="aj-cust" value="'+V.cust+'" placeholder="Customer name"></div>'+
        '<div class="two"><div class="fld"><label class="flabel">Order / PO #</label><input class="in filled" id="aj-po" value="'+V.po+'"></div>'+
        '<div class="fld"><label class="flabel">Due date <span class="req">*</span></label><input class="in'+(V.due?' filled':'')+'" id="aj-due" value="'+V.due+'" placeholder="mm / dd"></div></div>'+
        '<div class="fld"><label class="flabel">Due date type</label><div class="tog" id="aj-duetype"><button class="t'+(V.hard?' on':'')+'" data-h="1">Hard deadline</button><button class="t'+(V.hard?'':' on')+'" data-h="0">Soft / flexible</button></div></div></div>'+
      '<div class="sec"><h3>Decoration method</h3><div class="seg">'+methSeg+'</div></div>'+
      '<div class="sec"><h3>Design &amp; Placement</h3><div id="aj-locs">'+locBlock(1,true,V.rerun)+'</div><button class="addloc" id="aj-addloc">+ Add another location (sleeve, back, cap…)</button></div>'+
      '<div class="sec"><h3>Garment</h3><div class="two">'+
        '<div class="fld"><label class="flabel">Garment <span class="req">*</span></label><select class="in" id="aj-garment"></select></div>'+
        '<div class="fld"><label class="flabel">Fabric <span class="req">*</span></label><select class="in" id="aj-fabric"></select></div></div>'+
        '<div class="fld"><label class="flabel">Quantity <span class="req">*</span></label><input class="in filled" id="aj-qty" value="'+V.qty+'"></div></div>'+
      '<div class="sec"><h3>Production</h3>'+
        '<div class="fld"><label class="flabel">Machine</label><select class="in" id="aj-machine"><option>M1 - 6-Head</option><option>M2 - 6-Head</option></select></div>'+
        '<div class="fld"><label class="flabel">Operator (optional)</label><input class="in'+(isEdit?' filled':'')+'" id="aj-op" value="'+(isEdit?esc(opOf(ajEditDi)):'')+'" placeholder="Unassigned"></div></div>'+
      '<div class="sec"><h3>Estimated time</h3><div class="estcard">'+
        '<p class="big" id="aj-big">~7.4 hrs</p><p class="biglab" id="aj-biglab">Production time · 48 pieces</p>'+
        '<div class="bt"><span id="aj-setuplab">Setup (new design)</span><span class="v" id="aj-setup">45 min</span></div>'+
        '<div class="bt"><span>Machine run</span><span class="v" id="aj-mach">3.0 hrs</span></div>'+
        '<div class="bt"><span>Per-piece labor</span><span class="v" id="aj-labor">3.4 hrs</span></div>'+
        '<div class="fitrow"><span id="aj-cyc">8 cycles</span><span>ceil(48 ÷ 6 heads)</span></div>'+
        '<div class="addtime"><span>Additional time</span><div class="stepper"><button class="stbtn" id="aj-minus" aria-label="Decrease"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><input class="atin" id="aj-at" value="0.0" aria-label="Additional time in hours"><button class="stbtn" id="aj-plus" aria-label="Increase"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button><span class="atunit">hrs</span></div></div>'+
      '</div></div>'+
    '</div>'+
    (isEdit
      ? '<div class="ovfoot"><button class="btn primary" id="aSave">Save Changes</button></div>'
      : '<div class="ovfoot"><button class="btn primary" id="aAddBtn">Add to schedule</button><button class="btn" id="aDraft">Save as draft</button></div>');
  wireAdd(); if(isEdit)caseButtons($('ovAdd')); slide('ovAdd',true);
}
function wireAdd(){
  const ov=$('ovAdd');
  const close=()=>slide('ovAdd',false);
  $('aBack').onclick=close; $('aClose').onclick=close;
  if($('aAddBtn'))$('aAddBtn').onclick=close;
  if($('aDraft'))$('aDraft').onclick=close;
  if($('aSave'))$('aSave').onclick=saveJobEdit;
  // segmented + toggles (delegated)
  ov.addEventListener('click',e=>{
    const o=e.target.closest('.seg .o'); if(o){o.parentNode.querySelectorAll('.o').forEach(x=>x.classList.remove('on'));o.classList.add('on');}
    const t=e.target.closest('.tog .t');
    if(t){const tog=t.closest('.tog'); if(!tog.classList.contains('disabled')){tog.querySelectorAll('.t').forEach(x=>x.classList.remove('on'));t.classList.add('on');
      if(tog.classList.contains('aj-design')){const loc=tog.closest('.loc');const rerun=t.dataset.v==='rerun';
        loc.querySelectorAll('.aj-dig,.aj-sample').forEach(el=>el.classList.toggle('disabled',rerun));ajEst();}}}
  });
  ajFillGarments();
  if(ajEditDi!=null){                       // prefill garment/fabric/machine for edit
    const b=data[curMethod][ajEditDi];
    $('aj-garment').value=b.garment||garmentGuess(b.count); ajFillFabrics();
    if(b.fabric)$('aj-fabric').value=b.fabric;
    $('aj-machine').value=((b.lane||0)===1?'M2 - 6-Head':'M1 - 6-Head');
  }
  $('aj-garment').onchange=()=>{ajFillFabrics();ajEst();};
  $('aj-fabric').onchange=ajEst;
  $('aj-qty').oninput=ajEst;
  $('aj-minus').onclick=()=>ajSetAdd(AJ.add-0.1);
  $('aj-plus').onclick=()=>ajSetAdd(AJ.add+0.1);
  $('aj-at').onchange=()=>ajSetAdd(parseFloat($('aj-at').value));
  $('aj-addloc').onclick=()=>{const w=$('aj-locs');const d=document.createElement('div');d.innerHTML=locBlock(w.children.length+1,false);w.appendChild(d.firstChild);if(ajEditDi!=null)caseButtons(w);};
  ov.addEventListener('click',e=>{ if(e.target.classList.contains('del')){const locs=ov.querySelectorAll('#aj-locs .loc');if(locs.length>1){e.target.closest('.loc').remove();ov.querySelectorAll('#aj-locs .loc .lh span').forEach((s,i)=>s.textContent='LOCATION '+(i+1));}}});
  ajEst();
}
function ajFillGarments(){const g=$('aj-garment');g.innerHTML=Object.keys(AJG).map(k=>'<option>'+k+'</option>').join('');g.value='Hoodie';ajFillFabrics();}
function ajFillFabrics(){const g=$('aj-garment').value;$('aj-fabric').innerHTML=AJG[g].fabrics.map(f=>'<option>'+f+'</option>').join('');}
function ajAnyNew(){return [...$('ovAdd').querySelectorAll('#aj-locs .aj-design .t.on')].some(t=>t.dataset.v==='new');}
function ajEst(){
  const g=$('aj-garment').value,f=$('aj-fabric').value,qty=parseInt($('aj-qty').value,10)||0;
  const mach=2.0+ajDelta(g+'|'+f+'|m'),labor=2.4+ajDelta(g+'|'+f+'|l'),isNew=ajAnyNew(),setup=isNew?0.75:0.25;
  const total=setup+mach+labor+AJ.add; AJ.total=total;
  $('aj-mach').textContent=mach.toFixed(1)+' hrs';$('aj-labor').textContent=labor.toFixed(1)+' hrs';
  $('aj-setuplab').textContent=isNew?'Setup (new design)':'Setup (rerun)';$('aj-setup').textContent=isNew?'45 min':'15 min';
  $('aj-big').textContent='~'+total.toFixed(1)+' hrs';$('aj-biglab').textContent='Production time · '+qty+' pieces';
  $('aj-cyc').textContent=Math.ceil(qty/6)+' cycles';
}
function ajSetAdd(v){v=Math.max(0,Math.round(v*10)/10);AJ.add=v;$('aj-at').value=v.toFixed(1);ajEst();}
function saveJobEdit(){
  const b=data[curMethod][ajEditDi];
  markDirty();
  b.cust=val('aj-cust')||b.cust;
  b.due=val('aj-due')||b.due;
  b.hard=$('aj-duetype').querySelector('.t.on').dataset.h==='1';
  b.rerun=ajAnyNew()?false:true;               // any location still "new" ⇒ new design
  b.garment=$('aj-garment').value; b.fabric=$('aj-fabric').value;
  const qty=parseInt($('aj-qty').value,10)||qtyOf(b.count);
  b.count=qty+' '+nounOf(b.count);
  b.lane=$('aj-machine').value.indexOf('M2')===0?1:0;
  b._op=val('aj-op');
  b.hrs=Math.max(1,Math.round(AJ.total));      // apply the recalculated run time → reflows schedule
  ajEditDi=null;
  slide('ovAdd',false);
  renderDetail();            // refresh the detail underneath
  renderMainKeepOverlay();   // reflow the board + change bar
}

/* =============== overlay slide helpers =============== */
function slide(id,on){const el=$(id);if(on){el.style.display='flex';requestAnimationFrame(()=>el.classList.add('on'));}else{el.classList.remove('on');setTimeout(()=>{el.style.display='';},220);}}
function slideReset(id){$(id).style.display='flex';$(id).classList.add('on');}
function renderMainKeepOverlay(){const openOv=[...document.querySelectorAll('.ov.on')];renderMain();}

/* helpers */
function val(id){const e=$(id);return e?e.value.trim():'';}
function esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function titleCase(s){return s.replace(/\b\w/g,m=>m.toUpperCase());}   // caps first letter of each word, keeps the rest
function caseButtons(scope){ scope.querySelectorAll('.btn,.seg .o,.tog .t,.addloc,.del').forEach(el=>{ el.textContent=titleCase(el.textContent); }); }

renderMain();
</script>
</body>
</html>
