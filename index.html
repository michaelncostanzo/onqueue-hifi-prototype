<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnQueue — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Fraunces:opsz,wght@9..144,500;600;700&display=swap">
<style>
  :root{
    --bg:#efe9dd; --ink:#191c24; --mut:#565c69; --faint:#6c675b; --line:#e3ddd0;
    --emb:#6d5cb3; --emb-d:#4c3f88; --emb-t:#efedf9; --logobg:#e7ddc9; --qpurple:#7d6fa6;
    --sh-sm:0 1px 2px rgba(20,23,33,.07);
    --sh:0 14px 34px -18px rgba(40,30,15,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);
    background:radial-gradient(1100px 560px at 70% -10%,#f6f1e7 0,#efe9dd 58%,#e7dfce 100%);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;min-height:100%}
  .wrap{width:100%;max-width:720px;text-align:center}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--emb)}
  .brand{display:inline-flex;align-items:center;gap:12px;margin-top:12px}
  .brand .mark{width:46px;height:46px;border-radius:12px;background:var(--logobg);overflow:hidden;display:flex;
    box-shadow:var(--sh-sm),inset 0 0 0 1px rgba(120,90,40,.06)}
  .brand .mark svg{width:46px;height:46px;display:block}
  .brand h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:44px;letter-spacing:-.02em;margin:0;line-height:1;display:inline-flex;align-items:baseline}
  .brand .qsvg{height:.82em;width:auto;transform:translateY(.1em);margin:0 -.01em}
  .tagline{color:var(--mut);font-size:15px;margin:16px 0 40px}

  .cards{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
  .card{appearance:none;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:20px;
    width:260px;padding:34px 24px 26px;display:flex;flex-direction:column;align-items:center;gap:20px;
    box-shadow:var(--sh);transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;cursor:pointer}
  .card:hover{transform:translateY(-4px);box-shadow:0 22px 46px -20px rgba(40,30,15,.55);border-color:#d8d0ee}
  .art{height:132px;display:flex;align-items:center;justify-content:center}
  .art svg{display:block}
  .label{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--ink)}
  .foot{margin-top:40px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--faint)}
  @media(max-width:560px){.card{width:100%;max-width:320px}.brand h1{font-size:36px}}
</style>
</head>

          <rect x="14" y="92" width="50" height="18" rx="5" fill="#fbf1e2"/><rect x="14" y="92" width="4" height="18" rx="2" fill="#c07a2e"/>
          <rect x="28" y="120" width="22" height="4" rx="2" fill="#cfc8ba"/>
        </svg>
      </div>
      <div class="label">Open phone prototype</div>
    </a>
  </div>

  <div class="foot">OnQueue · DesignLab capstone</div>
</div>
